name: Profile Assets
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p assets
      - name: Fetch assets
        run: |
          fetch() { curl -sL --fail --max-time 15 "$1" > "$2.new" && mv "$2.new" "$2" || rm -f "$2.new"; }

          fetch "https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=26&duration=3000&pause=1000&color=38BDF8&center=true&vCenter=true&width=600&lines=Hi+%F0%9F%91%8B%2C+I'm+YaoYuLiang;AI+Engineer;Go+%7C+Java+%7C+Python;AI+Agent+Explorer" assets/typing.svg
          fetch "https://readme-typing-svg.demolab.com/?font=JetBrains+Mono&weight=700&size=26&duration=3000&pause=1000&color=38BDF8&center=true&vCenter=true&width=600&lines=%e4%bd%a0%e5%a5%bd+%f0%9f%91%8b%2c+%e6%88%91%e6%98%af+YaoYuLiang%3bAI+%e5%b7%a5%e7%a8%8b%e5%b8%88%3bGo+%7c+Java+%7c+Python%3bAI+Agent+%e6%8e%a2%e7%b4%a2%e8%80%85" assets/typing-zh.svg
          # Trophies: official instance is shut down, using a community mirror; local cache keeps the last good copy
          fetch "https://github-profile-trophy-ahmed.vercel.app/?username=yusanwen-code&theme=onestar&no-bg=true&no-frame=true&row=1&column=7" assets/trophy.svg
          fetch "https://capsule-render.vercel.app/api?type=soft&color=0:38BDF8,100:818CF8&height=100&section=header&text=YaoYuLiang&fontSize=30&fontColor=ffffff&animation=fadeIn&fontAlignY=35&desc=AI%20Engineer%20%7C%20Agent%20Explorer&descSize=13&descAlignY=60" assets/header.svg
          fetch "https://capsule-render.vercel.app/api?type=waving&color=0:38BDF8,100:818CF8&height=120&section=footer" assets/footer.svg
          fetch "https://capsule-render.vercel.app/api?type=rect&color=0:38BDF8,100:818CF8&height=3" assets/line.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No asset changes, skipping commit"
            exit 0
          fi
          git commit -m "Update profile assets"
          # main may have moved since checkout (manual pushes, other runs) — rebase and retry
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1
